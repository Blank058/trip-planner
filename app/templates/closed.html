{% extends "base.html" %}
{% block title %}{{ trip.name }} · Trip Planner{% endblock %}
{% block content %}
<h1>{{ trip.name }}</h1>
<p>Responses for this trip are closed.</p>
{% if trip.results_public %}<p><a href="{{ url_for('trips.public_results', slug=trip.slug) }}">See the results</a></p>{% endif %}
{% endblock %}
